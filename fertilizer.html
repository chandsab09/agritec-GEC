function t(key){
return translations[currentLanguage]?.[key] ||
translations.en[key] || key;
}


// APPLY LANGUAGE

function applyLanguage(){

document.getElementById("languageSelect").value=currentLanguage;

document.getElementById("languageLabel").textContent=t("language");

document.getElementById("pageTitle").textContent=t("title");
document.getElementById("formTitle").textContent=t("formTitle");

document.getElementById("nameLabel").textContent=t("name");
document.getElementById("fertilizerName").placeholder=t("namePlaceholder");

document.getElementById("typeLabel").textContent=t("type");
document.getElementById("selectType").textContent=t("selectType");
document.getElementById("organic").textContent=t("organic");
document.getElementById("inorganic").textContent=t("inorganic");
document.getElementById("biofertilizer").textContent=t("biofertilizer");

document.getElementById("quantityLabel").textContent=t("quantity");
document.getElementById("quantity").placeholder=t("quantityPlaceholder");

document.getElementById("dateLabel").textContent=t("date");

document.getElementById("cropLabel").textContent=t("crop");
document.getElementById("cropName").placeholder=t("cropPlaceholder");

document.getElementById("notesLabel").textContent=t("notes");
document.getElementById("notes").placeholder=t("notesPlaceholder");

document.getElementById("saveButton").textContent=t("save");

document.getElementById("recordsTitle").textContent=t("records");

document.getElementById("nameTh").textContent=t("nameTh");
document.getElementById("typeTh").textContent=t("typeTh");
document.getElementById("quantityTh").textContent=t("quantityTh");
document.getElementById("dateTh").textContent=t("dateTh");
document.getElementById("cropTh").textContent=t("cropTh");
document.getElementById("notesTh").textContent=t("notesTh");
document.getElementById("actionTh").textContent=t("actionTh");

document.getElementById("backButton").textContent=t("back");

loadFertilizers();

}


// LANGUAGE CHANGE

document.getElementById("languageSelect")
.addEventListener("change",function(){

currentLanguage=this.value;

localStorage.setItem("agritec_dashboard_language",currentLanguage);

applyLanguage();

});


// GET USER

async function getUser(){

const {data,error}=await supabaseClient.auth.getUser();

if(error||!data.user){

alert(t("login"));
window.location.href="login.html";

return null;
}

return data.user;

}


// LOAD FERTILIZERS

async function loadFertilizers(){

const user=await getUser();

if(!user)return;

table.innerHTML="";

const loadingRow=document.createElement("tr");
const loadingCell=document.createElement("td");

loadingCell.colSpan=7;
loadingCell.textContent=t("loading");

loadingRow.appendChild(loadingCell);
table.appendChild(loadingRow);

const {data,error}=await supabaseClient
.from("fertilizer_records")
.select("*")
.eq("user_id",user.id)
.order("created_at",{ascending:false});

if(error){

table.innerHTML="";

const row=document.createElement("tr");
const cell=document.createElement("td");

cell.colSpan=7;
cell.textContent=t("error")+error.message;

row.appendChild(cell);
table.appendChild(row);

return;
}

if(!data||data.length===0){

table.innerHTML="";

const row=document.createElement("tr");
const cell=document.createElement("td");

cell.colSpan=7;
cell.textContent=t("noRecords");

row.appendChild(cell);
table.appendChild(row);

return;
}

table.innerHTML="";

data.forEach(item=>{

const row=document.createElement("tr");

const values=[
item.fertilizer_name,
item.fertilizer_type||"-",
item.quantity??"-",
item.application_date||"-",
item.crop_name||"-",
item.notes||"-"
];

values.forEach(value=>{

const cell=document.createElement("td");
cell.textContent=value;

row.appendChild(cell);

});

const actionCell=document.createElement("td");
const deleteButton=document.createElement("button");

deleteButton.textContent=t("delete");
deleteButton.className="delete";

deleteButton.addEventListener("click",()=>{
deleteFertilizer(item.id);
});

actionCell.appendChild(deleteButton);
row.appendChild(actionCell);

table.appendChild(row);

});

}


// SAVE FERTILIZER

form.addEventListener("submit",async function(event){

event.preventDefault();

const user=await getUser();

if(!user)return;

const record={

user_id:user.id,

fertilizer_name:
document.getElementById("fertilizerName").value.trim(),

fertilizer_type:
document.getElementById("fertilizerType").value,

quantity:
Number(document.getElementById("quantity").value),

application_date:
document.getElementById("applicationDate").value,

crop_name:
document.getElementById("cropName").value.trim(),

notes:
document.getElementById("notes").value.trim()

};

message.style.color="#2e7d32";
message.textContent=t("saving");

const {error}=await supabaseClient
.from("fertilizer_records")
.insert([record]);

if(error){

message.style.color="red";
message.textContent=t("error")+error.message;

return;
}

message.style.color="green";
message.textContent=t("saved");

form.reset();

loadFertilizers();

});


// DELETE FERTILIZER

async function deleteFertilizer(id){

if(!confirm(t("confirmDelete")))return;

const user=await getUser();

if(!user)return;

const {error}=await supabaseClient
.from("fertilizer_records")
.delete()
.eq("id",id)
.eq("user_id",user.id);

if(error){

alert(t("error")+error.message);
return;
}

alert(t("deleted"));

loadFertilizers();

}


// START

applyLanguage();
