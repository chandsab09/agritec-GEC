* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

.language-box {
    width: 95%;
    margin: 15px auto;
    display: flex;
    justify-content: flex-end;
}

.language-box select {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.card {
    width: 95%;
    max-width: 650px;
    margin: 20px auto;
    padding: 25px;
}

.card input {
    width: 100%;
    padding: 11px;
    margin-top: 5px;
}

.card label {
    font-weight: bold;
}

button {
    padding: 10px 16px;
    margin: 5px;
    cursor: pointer;
}

.table-container {
    width: 95%;
    margin: 25px auto;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
}

th {
    background: #2e7d32;
    color: white;
}

.delete-btn {
    background: #d32f2f;
    color: white;
}

#message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="language-box">

<h1 id="pageTitle">🌱 Crop Management</h1>

        <input type="text" id="cropType" required>
        <br><br>

        <label id="areaLabel">Area (Acres)</label><br>
        <input type="number" id="area" min="0.01" step="0.01" required>
        <br><br>

        <label id="plantingLabel">Planting Date</label><br>
        <input type="date" id="plantingDate" required>
        <br><br>

        <label id="harvestLabel">Harvest Date</label><br>
        <input type="date" id="harvestDate" required>
        <br><br>

        <button type="submit" id="addButton">Add Crop</button>

        <button type="button" id="backButton"
        onclick="window.location.href='p.html'">

        </button>

    </form>

    <p id="message"></p>

</div>

<h2 id="viewTitle">📋 View Crops</h2>

// LANGUAGE CHANGE

function changeLanguage(lang) {

    currentLanguage = lang;

    localStorage.setItem("agritec_dashboard_language", lang);

    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("pageTitle").textContent = t.pageTitle;
    document.getElementById("addTitle").textContent = t.addTitle;

    document.getElementById("nameLabel").textContent = t.name;
    document.getElementById("typeLabel").textContent = t.type;
    document.getElementById("areaLabel").textContent = t.area;
    document.getElementById("plantingLabel").textContent = t.planting;
    document.getElementById("harvestLabel").textContent = t.harvest;

    document.getElementById("addButton").textContent = t.add;
    document.getElementById("backButton").textContent = t.back;

    document.getElementById("viewTitle").textContent = t.view;

    document.getElementById("thName").textContent = t.thName;
    document.getElementById("thType").textContent = t.thType;
    document.getElementById("thArea").textContent = t.thArea;
    document.getElementById("thPlanting").textContent = t.thPlanting;
    document.getElementById("thHarvest").textContent = t.thHarvest;
    document.getElementById("thAction").textContent = t.thAction;

    languageSelect.value = lang;

    loadCrops();
}


languageSelect.addEventListener("change", function() {
    changeLanguage(this.value);
});


// ADD CROP

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const t = translations[currentLanguage];

    addButton.disabled = true;
    message.innerText = t.saving;

    try {

        const { data: userData, error: userError } =
            await supabaseClient.auth.getUser();

        if (userError) throw userError;

        const user = userData.user;

        if (!user) {
            alert(t.login);
            window.location.href = "login.html";
            return;
        }

        const name = document.getElementById("cropName").value.trim();
        const type = document.getElementById("cropType").value.trim();
        const area = Number(document.getElementById("area").value);
        const planting = document.getElementById("plantingDate").value;
        const harvest = document.getElementById("harvestDate").value;

        if (harvest < planting) {
            message.innerText = t.dateError;
            return;
        }

        const { error } = await supabaseClient
            .from("crops")
            .insert([{
                crop_name: name,
                crop_type: type,
                area: area,
                sowing_date: planting,
                harvest_date: harvest,
                user_id: user.id
            }]);

        if (error) throw error;

        message.innerText = t.added;

        form.reset();

        loadCrops();

    } catch (error) {

        message.innerText = t.error + error.message;
        console.error(error);

    } finally {

        addButton.disabled = false;

    }

});


// VIEW CROPS

async function loadCrops() {

    const t = translations[currentLanguage];

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        table.innerHTML =
            `<tr><td colspan="6">${t.login}</td></tr>`;
        return;
    }

    const { data, error } = await supabaseClient
        .from("crops")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

        table.innerHTML =
            `<tr><td colspan="6">${t.error}${error.message}</td></tr>`;

        return;
    }

    table.innerHTML = "";

    if (!data || data.length === 0) {

        table.innerHTML =
            `<tr><td colspan="6">${t.noCrops}</td></tr>`;

        return;
    }

    data.forEach(crop => {

        const row = document.createElement("tr");

        const values = [
            crop.crop_name,
            crop.crop_type,
            crop.area + t.acres,
            crop.sowing_date,
            crop.harvest_date
        ];

        values.forEach(value => {

            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);

        });

        const actionCell = document.createElement("td");

        const deleteButton = document.createElement("button");

        deleteButton.textContent = t.delete;
        deleteButton.className = "delete-btn";

        deleteButton.addEventListener("click", function() {
            deleteCrop(crop.id);
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        table.appendChild(row);

    });

}


// DELETE CROP

async function deleteCrop(id) {

    const t = translations[currentLanguage];

    if (!confirm(t.confirm)) {
        return;
    }

    const { error } = await supabaseClient
        .from("crops")
        .delete()
        .eq("id", id);

    if (error) {

        alert(t.deleteError + error.message);

    } else {

        alert(t.deleted);

        loadCrops();

    }

}

changeLanguage(currentLanguage);
