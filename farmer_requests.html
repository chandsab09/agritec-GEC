function getLanguage(){
 return localStorage.getItem("agritec_dashboard_language") || "en";
}

function t(key){
 return translations[getLanguage()]?.[key] || translations.en[key] || key;
}

function applyLanguage(){
 const lang=getLanguage();
 document.getElementById("languageSelect").value=lang;
 document.documentElement.lang=lang;

 document.querySelectorAll("[data-i18n]").forEach(el=>{
   const key=el.getAttribute("data-i18n");
   if(translations[lang][key]) el.textContent=translations[lang][key];
 });
 displayRequests();
}

document.getElementById("languageSelect").addEventListener("change",function(){
 localStorage.setItem("agritec_dashboard_language",this.value);
 applyLanguage();
});

function escapeHTML(value){
 return String(value ?? "")
 .replace(/&/g,"&amp;").replace(/</g,"&lt;")
 .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

async function initialize(){
 const {data,error}=await supabaseClient.auth.getUser();

 if(error||!data.user){
  alert(t("pleaseLogin"));
  window.location.href="index.html";
  return;
 }

 currentUser=data.user;
 applyLanguage();
 await loadRequests();
}

async function loadRequests(){
 if(!currentUser)return;

 document.getElementById("loading").style.display="block";
 document.getElementById("empty").style.display="none";
 document.getElementById("error").style.display="none";
 document.getElementById("requestsContainer").innerHTML="";

 const {data,error}=await supabaseClient
 .from("consumer_orders")
 .select("*")
 .eq("farmer_id",currentUser.id)
 .order("created_at",{ascending:false});

 document.getElementById("loading").style.display="none";

 if(error){
  showError(error.message);
  return;
 }

 allRequests=data||[];
 updateSummary();
 displayRequests();
}

function updateSummary(){
 document.getElementById("totalCount").textContent=allRequests.length;
 document.getElementById("pendingCount").textContent=
  allRequests.filter(r=>r.status==="Pending").length;
 document.getElementById("acceptedCount").textContent=
  allRequests.filter(r=>r.status==="Accepted").length;
 document.getElementById("rejectedCount").textContent=
  allRequests.filter(r=>r.status==="Rejected").length;
}

function displayRequests(){
 if(!currentUser)return;

 const container=document.getElementById("requestsContainer");
 const filter=document.getElementById("statusFilter").value;
 container.innerHTML="";

 let filtered=allRequests;
 if(filter!=="All")filtered=allRequests.filter(r=>r.status===filter);

 if(filtered.length===0){
  document.getElementById("empty").style.display="block";
  document.getElementById("empty").textContent=
   allRequests.length===0?t("empty"):t("filterEmpty");
  return;
 }

 document.getElementById("empty").style.display="none";

 filtered.forEach(request=>{
  const card=document.createElement("div");
  card.className="request-card";

  const statusClass=request.status==="Accepted"?"accepted":
    request.status==="Rejected"?"rejected":"pending";

  const date=request.created_at?
   new Date(request.created_at).toLocaleString():t("unknown");

  const statusText=request.status==="Accepted"?t("accepted"):
   request.status==="Rejected"?t("rejected"):t("pending");

  card.innerHTML=`
   <h2>${escapeHTML(request.product_name||t("product"))}</h2>

   <div class="consumer-details">
    <h3>👤 ${t("consumer")}</h3>
    <div class="info"><strong>${t("name")}:</strong>
     ${escapeHTML(request.consumer_name||t("notProvided"))}</div>
    <div class="info"><strong>${t("phone")}:</strong>
     ${escapeHTML(request.consumer_phone||t("notProvided"))}</div>
   </div>

   <div class="info"><strong>${t("requestId")}:</strong>
    ${escapeHTML(request.id)}</div>
   <div class="info"><strong>${t("category")}:</strong>
    ${escapeHTML(request.product_type||t("na"))}</div>
   <div class="info"><strong>${t("quantity")}:</strong>
    ${escapeHTML(String(request.quantity??""))}</div>
   <div class="info"><strong>${t("date")}:</strong>
    ${escapeHTML(date)}</div>

   <div class="message"><strong>${t("message")}:</strong><br>
    ${escapeHTML(request.message||t("noMessage"))}</div>

   <span class="status ${statusClass}">${escapeHTML(statusText)}</span>

   ${request.status==="Pending"?`
    <div class="actions">
     <button class="accept-btn" data-action="accept">✓ ${t("accept")}</button>
     <button class="reject-btn" data-action="reject">✕ ${t("reject")}</button>
    </div>`:""}
  `;

  const acceptBtn=card.querySelector('[data-action="accept"]');
  const rejectBtn=card.querySelector('[data-action="reject"]');

  if(acceptBtn)acceptBtn.addEventListener("click",()=>acceptRequest(request.id,acceptBtn));
  if(rejectBtn)rejectBtn.addEventListener("click",()=>rejectRequest(request.id,rejectBtn));

  container.appendChild(card);
 });
}

async function acceptRequest(orderId,button){
 if(!confirm(t("confirmAccept")))return;

 button.disabled=true;

 const {data,error}=await supabaseClient.rpc(
  "accept_consumer_order",{order_id:orderId}
 );

 if(error){
  alert(t("error")+error.message);
  button.disabled=false;
  return;
 }

 alert(t("acceptSuccess"));

 button.disabled=true;

 const {error}=await supabaseClient

 .eq("status","Pending");

 if(error){
