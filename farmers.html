// LANGUAGE CHANGE

function changeLanguage(lang) {

    currentLanguage = lang;

    localStorage.setItem("agritec_dashboard_language", lang);

    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("pageTitle").textContent = t.pageTitle;
    document.getElementById("addTitle").textContent = t.addTitle;

    document.getElementById("nameLabel").textContent = t.name;
    document.getElementById("phoneLabel").textContent = t.phone;
    document.getElementById("landLabel").textContent = t.land;
    document.getElementById("locationLabel").textContent = t.location;

    document.getElementById("addButton").textContent = t.add;
    document.getElementById("backButton").textContent = t.back;

    document.getElementById("viewTitle").textContent = t.view;

    document.getElementById("thName").textContent = t.thName;
    document.getElementById("thPhone").textContent = t.thPhone;
    document.getElementById("thLand").textContent = t.thLand;
    document.getElementById("thLocation").textContent = t.thLocation;
    document.getElementById("thAction").textContent = t.thAction;

    languageSelect.value = lang;

    loadFarmers();
}

languageSelect.addEventListener("change", function() {
    changeLanguage(this.value);
});


// ADD FARMER

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const t = translations[currentLanguage];

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        alert(t.login);
        window.location.href = "login.html";
        return;
    }

    const { error } = await supabaseClient
        .from("farmers")
        .insert([{
            farmer_name: document.getElementById("farmerName").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            land_area: Number(document.getElementById("land").value),
            address: document.getElementById("location").value.trim(),
            user_id: userData.user.id
        }]);

    if (error) {
        message.innerText = t.error + error.message;
    } else {
        message.innerText = t.added;
        form.reset();
        loadFarmers();
    }
});


// LOAD FARMERS

async function loadFarmers() {

    const t = translations[currentLanguage];

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        table.innerHTML =
            `<tr><td colspan="5">${t.login}</td></tr>`;
        return;
    }

    const { data, error } = await supabaseClient
        .from("farmers")
        .select("*")
        .order("id", { ascending: false });

    if (error) {
        table.innerHTML =
            `<tr><td colspan="5">${t.error}${error.message}</td></tr>`;
        return;
    }

    table.innerHTML = "";

    if (!data || data.length === 0) {
        table.innerHTML =
            `<tr><td colspan="5">${t.noFarmers}</td></tr>`;
        return;
    }

    data.forEach(farmer => {

        const row = document.createElement("tr");

        const values = [
            farmer.farmer_name,
            farmer.phone,
            farmer.land_area + " Acres",
            farmer.address
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");

        const deleteButton = document.createElement("button");

        deleteButton.textContent = t.delete;
        deleteButton.className = "delete-btn";

        deleteButton.addEventListener("click", function() {
            deleteFarmer(farmer.id);
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        table.appendChild(row);
    });
}


// DELETE FARMER

async function deleteFarmer(id) {

    const t = translations[currentLanguage];

    if (!confirm(t.confirm)) {
        return;
    }

    const { error } = await supabaseClient
        .from("farmers")
        .delete()
        .eq("id", id);

    if (error) {
        alert(t.deleteError + error.message);
    } else {
        alert(t.deleted);
        loadFarmers();
    }
}


// INITIAL LOAD

changeLanguage(currentLanguage);
