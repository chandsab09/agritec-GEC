function getLanguage() {
    return localStorage.getItem("agritec_dashboard_language") || "en";
}

function t(key) {
    const lang = getLanguage();
    return translations[lang]?.[key] || translations.en[key] || key;
}

function applyLanguage() {

    document.getElementById("languageSelect").value = getLanguage();

    document.getElementById("pageHeading").textContent = t("heading");
    document.getElementById("pageSubtitle").textContent = t("subtitle");

    document.getElementById("addTitle").textContent = t("addTitle");

    document.getElementById("nameLabel").textContent = t("name");
    document.getElementById("expenseName").placeholder = t("namePlaceholder");

    document.getElementById("categoryLabel").textContent = t("category");
    document.getElementById("category").placeholder = t("categoryPlaceholder");

    document.getElementById("amountLabel").textContent = t("amount");
    document.getElementById("amount").placeholder = t("amountPlaceholder");

    document.getElementById("dateLabel").textContent = t("date");

    document.getElementById("addButton").textContent = t("add");
    document.getElementById("backButton").textContent = t("back");

    document.getElementById("viewTitle").textContent = t("view");

    document.getElementById("nameHeading").textContent = t("nameHeading");
    document.getElementById("categoryHeading").textContent = t("categoryHeading");
    document.getElementById("amountHeading").textContent = t("amountHeading");
    document.getElementById("dateHeading").textContent = t("dateHeading");
    document.getElementById("actionHeading").textContent = t("action");

    loadExpenses();
}

document.getElementById("languageSelect").addEventListener("change", function() {

    localStorage.setItem("agritec_dashboard_language", this.value);

    applyLanguage();
});

async function addExpense() {

    const name = document.getElementById("expenseName").value.trim();
    const category = document.getElementById("category").value.trim();
    const amount = Number(document.getElementById("amount").value);
    const date = document.getElementById("expenseDate").value;

    if (
        !name ||
        !category ||
        !date ||
        !Number.isFinite(amount) ||
        amount <= 0
    ) {
        alert(t("fillDetails"));
        return;
    }

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {
        alert(t("login"));
        window.location.href = "login.html";
        return;
    }

    const { error } = await supabaseClient
        .from("expenses")
        .insert([{
            expense_name: name,
            category: category,
            amount: amount,
            expense_date: date,
            user_id: user.id
        }]);

    if (error) {
        alert(t("addError") + error.message);
        return;
    }

    alert(t("added"));

    document.getElementById("expenseName").value = "";
    document.getElementById("category").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("expenseDate").value = "";

    loadExpenses();
}

async function loadExpenses() {

    const list = document.getElementById("expenseList");

    list.innerHTML = `
        <tr>
            <td colspan="5">${t("loading")}</td>
        </tr>
    `;

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {

        list.innerHTML = `
            <tr>
                <td colspan="5">${t("login")}</td>
            </tr>
        `;

        window.location.href = "login.html";

        return;
    }

    const { data, error } = await supabaseClient
        .from("expenses")
        .select("*")
        .eq("user_id", user.id)
        .order("id", { ascending: false });

    if (error) {

        list.innerHTML = `
            <tr>
                <td colspan="5">${t("loadError")}${escapeHTML(error.message)}</td>
            </tr>
        `;

        return;
    }

    list.innerHTML = "";

    if (!data || data.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="5">${t("noExpenses")}</td>
            </tr>
        `;

        return;
    }

    data.forEach(expense => {

        const row = document.createElement("tr");

        const values = [
            expense.expense_name,
            expense.category,
            "₹" + Number(expense.amount || 0).toLocaleString("en-IN"),
            expense.expense_date
        ];

        values.forEach(value => {

            const cell = document.createElement("td");

            cell.textContent = value ?? "";

            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");

        const deleteButton = document.createElement("button");

        deleteButton.textContent = t("delete");
        deleteButton.className = "delete-btn";

        deleteButton.onclick = () => deleteExpense(expense.id);

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        list.appendChild(row);
    });
}

async function deleteExpense(id) {

    if (!confirm(t("deleteConfirm"))) {
        return;
    }

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {
        alert(t("login"));
        window.location.href = "login.html";
        return;
    }

    const { error } = await supabaseClient
        .from("expenses")
        .delete()
        .eq("id", id)
        .eq("user_id", user.id);

    if (error) {
        alert(t("deleteFailed") + error.message);
        return;
    }

    alert(t("deleted"));

    loadExpenses();
}

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[char]));
}
