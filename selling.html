<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Product Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f7f2;color:#26352b}
header{background:linear-gradient(135deg,#064e32,#2e8b57);color:white;padding:22px 35px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
header h1{font-size:25px}
header p{margin-top:5px}
.header-buttons{display:flex;gap:10px;flex-wrap:wrap}
.header-buttons button{border:none;padding:11px 18px;border-radius:7px;cursor:pointer;font-weight:bold}
.back-btn{background:white;color:#14633b}
.logout-btn{background:#e8f5e9;color:#14633b}
.container{width:92%;max-width:1100px;margin:25px auto}
.form-section{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #00000010}
.form-section h2{color:#14633b;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.form-group{display:flex;flex-direction:column}
.full-width{grid-column:1/-1}
label{font-weight:bold;margin-bottom:7px}
input,select,textarea{padding:12px;border:1px solid #ccc;border-radius:7px;font-size:15px;width:100%}
textarea{min-height:100px;resize:vertical}
.upload-btn{background:#198754;color:white;border:none;padding:14px;border-radius:7px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px;width:100%}
.upload-btn:hover{background:#116b40}
.upload-btn:disabled{background:#888;cursor:not-allowed}
#preview{display:none;width:180px;height:180px;object-fit:cover;margin-top:12px;border-radius:10px;border:1px solid #ddd}
#message{margin-top:15px;font-weight:bold;overflow-wrap:anywhere}
.products-section{margin-top:35px}
.products-section h2{color:#14633b;margin-bottom:20px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.product-card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px #00000012}
.product-card img{width:100%;height:210px;object-fit:cover;background:#eee}
.product-info{padding:18px}
.product-info h3{color:#14633b;margin-bottom:10px;overflow-wrap:anywhere}
.product-info p{margin:7px 0;color:#555;overflow-wrap:anywhere}
.delete-btn{width:100%;padding:11px;background:#dc3545;color:white;border:none;border-radius:7px;margin-top:12px;cursor:pointer}
.delete-btn:hover{background:#b02a37}
.delete-btn:disabled{background:#888;cursor:not-allowed}
.empty{color:#777;background:white;padding:20px;border-radius:10px}
footer{text-align:center;padding:25px;color:#666;margin-top:30px}
.language-box{display:flex;align-items:center;gap:8px}
.language-box select{width:auto;min-width:130px}
@media(max-width:650px){
header{padding:20px}
header h1{font-size:21px}
.form-grid{grid-template-columns:1fr}
.full-width{grid-column:auto}
.container{width:95%}
}
</style>
</head>

<body>

<header>
    <div>
        <h1 id="heading">🌾 Farmer Product Upload</h1>
        <p id="subtitle">Upload your products to the marketplace</p>
    </div>

    <div class="header-buttons">
        <div class="language-box">
            <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
                <option value="hi">हिंदी</option>
                <option value="te">తెలుగు</option>
                <option value="ta">தமிழ்</option>
            </select>
        </div>
        <button class="back-btn" id="backButton">Dashboard</button>
        <button class="logout-btn" id="logoutButton">Logout</button>
    </div>
</header>

<div class="container">

<section class="form-section">
    <h2 id="formTitle">➕ Add New Product</h2>

    <form id="productForm">
        <div class="form-grid">

            <div class="form-group">
                <label id="farmerNameLabel" for="farmerName">Farmer Name</label>
                <input type="text" id="farmerName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label id="phoneLabel" for="farmerPhone">Mobile Number</label>
                <input type="tel" id="farmerPhone" placeholder="Enter mobile number"
                       pattern="[0-9]{10}" maxlength="10" minlength="10" required>
            </div>

            <div class="form-group">
                <label id="productNameLabel" for="productName">Product Name</label>
                <input type="text" id="productName" placeholder="Example: Tomato" required>
            </div>

            <div class="form-group">
                <label id="categoryLabel" for="category">Category</label>
                <select id="category" required>
                    <option value="" id="categoryPlaceholder">Select Category</option>
                    <option value="Fruits" id="optFruits">Fruits</option>
                    <option value="Vegetables" id="optVegetables">Vegetables</option>
                    <option value="Crops" id="optCrops">Crops</option>
                    <option value="Livestock" id="optLivestock">Livestock</option>
                    <option value="Land" id="optLand">Agricultural Land</option>
                </select>
            </div>

            <div class="form-group">
                <label id="priceLabel" for="price">Price (₹)</label>
                <input type="number" id="price" min="0" step="0.01" placeholder="Enter price" required>
            </div>

            <div class="form-group">
                <label id="quantityLabel" for="quantity">Available Quantity</label>
                <input type="number" id="quantity" min="0" step="0.01" placeholder="Enter quantity" required>
            </div>

            <div class="form-group">
                <label id="unitLabel" for="unit">Unit</label>
                <select id="unit" required>
                    <option value="" id="unitPlaceholder">Select Unit</option>
                    <option value="kg" id="optKg">Kilogram (kg)</option>
                    <option value="quintal" id="optQuintal">Quintal</option>
                    <option value="piece" id="optPiece">Piece</option>
                    <option value="litre" id="optLitre">Litre</option>
                    <option value="acre" id="optAcre">Acre</option>
                    <option value="animal" id="optAnimal">Animal</option>
                </select>
            </div>

            <div class="form-group">
                <label id="locationLabel" for="location">Location</label>
                <input type="text" id="location" placeholder="Village / City" required>
            </div>

            <div class="form-group full-width">
                <label id="descriptionLabel" for="description">Description</label>
                <textarea id="description" placeholder="Enter product details..."></textarea>
            </div>

            <div class="form-group full-width">
                <label id="photoLabel" for="productImage">Product Photo</label>
                <input type="file" id="productImage" accept="image/*" required>
                <img id="preview" alt="Product preview">
            </div>
        </div>

        <button type="submit" class="upload-btn" id="uploadButton">Upload Product</button>
        <div id="message"></div>
    </form>
</section>

<section class="products-section">
    <h2 id="myProductsTitle">📦 My Uploaded Products</h2>
    <div class="products-grid" id="myProducts">
        <p class="empty" id="loadingProducts">Loading products...</p>
    </div>
</section>

</div>

<footer id="footerText">Farm Management System</footer>

function t(key){
return translations[currentLanguage]?.[key] ?? translations.en[key] ?? key;
}

function setText(id,key){
const element=document.getElementById(id);
if(element)element.textContent=t(key);
}

function setPlaceholder(id,key){
document.getElementById(id).placeholder=t(key);
}

function applyLanguage(){
const x=currentLanguage;

document.getElementById("languageSelect").value=x;

setText("heading","heading");
setText("subtitle","subtitle");
setText("backButton","dashboard");
setText("logoutButton","logout");
setText("formTitle","formTitle");

setText("farmerNameLabel","farmerName");
setPlaceholder("farmerName","farmerNamePlaceholder");
setText("phoneLabel","phone");
setPlaceholder("farmerPhone","phonePlaceholder");
setText("productNameLabel","productName");
setPlaceholder("productName","productPlaceholder");

setText("categoryLabel","category");
setText("categoryPlaceholder","selectCategory");
setText("optFruits","fruits");
setText("optVegetables","vegetables");
setText("optCrops","crops");
setText("optLivestock","livestock");
setText("optLand","land");

setText("priceLabel","price");
setPlaceholder("price","pricePlaceholder");
setText("quantityLabel","quantity");
setPlaceholder("quantity","quantityPlaceholder");

setText("unitLabel","unit");
setText("unitPlaceholder","selectUnit");
setText("optKg","kg");
setText("optQuintal","quintal");
setText("optPiece","piece");
setText("optLitre","litre");
setText("optAcre","acre");
setText("optAnimal","animal");

setText("locationLabel","location");
setPlaceholder("location","locationPlaceholder");
setText("descriptionLabel","description");
setPlaceholder("description","descriptionPlaceholder");
setText("photoLabel","photo");
document.getElementById("preview").alt=t("preview");

setText("uploadButton","upload");
setText("myProductsTitle","myProducts");
setText("footerText","footer");

loadMyProducts();
}

document.getElementById("languageSelect").addEventListener("change",function(){
currentLanguage=this.value;
localStorage.setItem("agritec_dashboard_language",currentLanguage);
applyLanguage();
});

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

/* LOGIN */

async function checkLogin(){
const {data,error}=await supabaseClient.auth.getUser();

if(error||!data.user){
alert(t("login"));
window.location.href="login.html";
return false;
}

currentUser=data.user;
return true;
}

/* IMAGE PREVIEW */

document.getElementById("productImage").addEventListener("change",function(){
const file=this.files[0];
const preview=document.getElementById("preview");

if(!file){
preview.style.display="none";
preview.src="";
return;
}

if(!file.type.startsWith("image/")){
alert(t("imageOnly"));
this.value="";
preview.style.display="none";
preview.src="";
return;
}

preview.src=URL.createObjectURL(file);
preview.style.display="block";
});

/* UPLOAD */

document.getElementById("productForm").addEventListener("submit",async function(event){
event.preventDefault();

if(!currentUser){
alert(t("sessionExpired"));
window.location.href="login.html";
return;
}

const farmerName=document.getElementById("farmerName").value.trim();
const farmerPhone=document.getElementById("farmerPhone").value.trim();
const name=document.getElementById("productName").value.trim();
const category=document.getElementById("category").value;
const price=Number(document.getElementById("price").value);
const quantity=Number(document.getElementById("quantity").value);
const unit=document.getElementById("unit").value;
const location=document.getElementById("location").value.trim();
const description=document.getElementById("description").value.trim();
const imageFile=document.getElementById("productImage").files[0];

const message=document.getElementById("message");
const uploadButton=document.getElementById("uploadButton");

if(!/^[0-9]{10}$/.test(farmerPhone)){
message.style.color="red";
message.textContent=t("validPhone");
return;
}

if(!imageFile){
message.style.color="red";
message.textContent=t("selectPhoto");
return;
}

if(price<0||quantity<0){
message.style.color="red";
message.textContent=t("invalidValues");
return;
}

uploadButton.disabled=true;
uploadButton.textContent=t("uploading");
message.textContent="";

let uploadedFilePath=null;

try{
const safeFileName=imageFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
const filePath=currentUser.id+"/"+Date.now()+"_"+safeFileName;
uploadedFilePath=filePath;

const {error:uploadError}=await supabaseClient.storage
.from("product-images")
.upload(filePath,imageFile);

if(uploadError)throw uploadError;

const {data:imageData}=supabaseClient.storage
.from("product-images")
.getPublicUrl(filePath);

const imageURL=imageData.publicUrl;

const productData={
farmer_id:currentUser.id,
farmer_name:farmerName,
farmer_phone:farmerPhone,
product_name:name,
category:category,
description:description,
price:price,
quantity:quantity,
unit:unit,
location:location,
image_url:imageURL,
status:"Available"
};

const {error:databaseError}=await supabaseClient
.from("farmer_products")
.insert([productData]);

if(databaseError)throw databaseError;

alert(t("uploadSuccess"));

document.getElementById("productForm").reset();

const preview=document.getElementById("preview");
preview.style.display="none";
preview.src="";

message.style.color="green";
message.textContent=t("uploadSuccess");

await loadMyProducts();

}catch(error){
console.error("Upload error:",error);

if(uploadedFilePath){
await supabaseClient.storage.from("product-images").remove([uploadedFilePath]);
}

message.style.color="red";
message.textContent=t("uploadFailed")+error.message;

alert(t("uploadError")+"\n\n"+error.message);

}finally{
uploadButton.disabled=false;
uploadButton.textContent=t("upload");
}
});

/* LOAD PRODUCTS */

async function loadMyProducts(){
const container=document.getElementById("myProducts");

container.innerHTML="<p class='empty'>"+escapeHTML(t("loading"))+"</p>";

if(!currentUser)return;

const {data,error}=await supabaseClient
.from("farmer_products")
.select("*")
.eq("farmer_id",currentUser.id)
.order("created_at",{ascending:false});

if(error){
console.error(error);
container.innerHTML="<p class='empty'>"+escapeHTML(t("loadFailed"))+
escapeHTML(error.message)+"</p>";
return;
}

if(!data||data.length===0){
container.innerHTML="<p class='empty'>"+escapeHTML(t("noProducts"))+"</p>";
return;
}

container.innerHTML="";

data.forEach(product=>{
const card=document.createElement("div");
card.className="product-card";

card.innerHTML=`
<img src="${escapeHTML(product.image_url||"")}"
alt="${escapeHTML(product.product_name)}">

<div class="product-info">
<h3>${escapeHTML(product.product_name)}</h3>

<p><b>${escapeHTML(t("farmer"))}</b>
${escapeHTML(product.farmer_name||t("notProvided"))}</p>

<p><b>${escapeHTML(t("mobile"))}</b>
${escapeHTML(product.farmer_phone||t("notProvided"))}</p>

<p><b>${escapeHTML(t("categoryCard"))}</b>
${escapeHTML(product.category)}</p>

<p><b>${escapeHTML(t("priceCard"))}</b> ₹${escapeHTML(product.price)}</p>

<p><b>${escapeHTML(t("quantityCard"))}</b>
${escapeHTML(product.quantity)} ${escapeHTML(product.unit)}</p>

<p><b>${escapeHTML(t("locationCard"))}</b>
${escapeHTML(product.location)}</p>

<p><b>${escapeHTML(t("descriptionCard"))}</b>
${escapeHTML(product.description||t("noDescription"))}</p>

<p><b>${escapeHTML(t("status"))}</b>
${escapeHTML(product.status||t("available"))}</p>

<button class="delete-btn">${escapeHTML(t("delete"))}</button>
</div>
`;

const deleteButton=card.querySelector(".delete-btn");

deleteButton.addEventListener("click",function(){
deleteProduct(product.id,product.image_url,deleteButton);
});

container.appendChild(card);
});
}

/* DELETE PRODUCT + IMAGE */

async function deleteProduct(productID,imageURL,button){
if(!confirm(t("confirmDelete")))return;

button.disabled=true;
button.textContent=t("deleting");

try{
const {data,error}=await supabaseClient
.from("farmer_products")
.delete()
.eq("id",productID)
.eq("farmer_id",currentUser.id)
.select();

if(error)throw error;

if(!data||data.length===0){
throw new Error(t("deletedNoPermission"));
}

let imageDeleted=true;

if(imageURL){
const marker="/product-images/";
const position=imageURL.indexOf(marker);

if(position!==-1){
const filePath=imageURL.substring(position+marker.length);

const {error:imageError}=await supabaseClient.storage
.from("product-images")
.remove([filePath]);

if(imageError){
console.error(t("photoDeleteError"),imageError);
imageDeleted=false;
}
}else{
imageDeleted=false;
}
}

if(imageDeleted){
alert(t("deleteSuccess"));
}else{
alert(t("photoDeleteWarning"));
}

await loadMyProducts();

}catch(error){
console.error("Delete error:",error);
alert(t("deleteFailed")+"\n\n"+error.message);
button.disabled=false;
button.textContent=t("delete");
}
}

/* DASHBOARD */

document.getElementById("backButton").addEventListener("click",function(){
window.location.href="p.html";
});

document.getElementById("logoutButton").addEventListener("click",async function(){
const {error}=await supabaseClient.auth.signOut();

if(error){
alert(t("logoutError")+error.message);
return;
}

window.location.href="login.html";
});

/* INIT */

async function initializePage(){
applyLanguage();

const loggedIn=await checkLogin();
if(!loggedIn)return;

await loadMyProducts();
}

initializePage();
