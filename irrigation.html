let currentLanguage =
localStorage.getItem("agritec_dashboard_language") || "en";

if(!translations[currentLanguage]){
currentLanguage="en";
}

function t(key){
return translations[currentLanguage][key] || translations.en[key] || key;
}

function applyLanguage(){

const lang=currentLanguage;

document.getElementById("languageSelect").value=lang;
document.getElementById("languageLabel").textContent=t("language");

document.getElementById("pageTitle").textContent=t("title");
document.getElementById("formTitle").textContent=t("formTitle");

document.getElementById("cropLabel").textContent=t("crop");
document.getElementById("cropName").placeholder=t("cropPlaceholder");

document.getElementById("dateLabel").textContent=t("date");

document.getElementById("waterLabel").textContent=t("water");
document.getElementById("waterQuantity").placeholder=t("waterPlaceholder");

document.getElementById("methodLabel").textContent=t("method");
document.getElementById("selectMethod").textContent=t("selectMethod");
document.getElementById("drip").textContent=t("drip");
document.getElementById("sprinkler").textContent=t("sprinkler");
document.getElementById("flood").textContent=t("flood");
document.getElementById("manual").textContent=t("manual");

document.getElementById("notesLabel").textContent=t("notes");
document.getElementById("notes").placeholder=t("notesPlaceholder");

document.getElementById("saveButton").textContent=t("save");
document.getElementById("recordsTitle").textContent=t("records");

document.getElementById("cropTh").textContent=t("cropTh");
document.getElementById("dateTh").textContent=t("dateTh");
document.getElementById("waterTh").textContent=t("waterTh");
document.getElementById("methodTh").textContent=t("methodTh");
document.getElementById("notesTh").textContent=t("notesTh");
document.getElementById("actionTh").textContent=t("actionTh");

document.getElementById("backButton").textContent=t("back");

loadRecords();
}

document.getElementById("languageSelect").addEventListener("change",function(){

currentLanguage=this.value;

localStorage.setItem("agritec_dashboard_language",currentLanguage);

applyLanguage();

});


// CHECK LOGIN

async function checkUser(){

const {data,error}=await supabaseClient.auth.getUser();

if(error||!data.user){
window.location.href="login.html";
return;
}

currentUser=data.user;

loadRecords();

}


// SAVE RECORD

document.getElementById("irrigationForm")
.addEventListener("submit",async function(event){

event.preventDefault();

if(!currentUser){
alert(t("loginError"));
return;
}

const record={
user_id:currentUser.id,
crop_name:document.getElementById("cropName").value.trim(),
irrigation_date:document.getElementById("irrigationDate").value,
water_quantity:Number(document.getElementById("waterQuantity").value),
irrigation_method:document.getElementById("irrigationMethod").value,
notes:document.getElementById("notes").value.trim()
};

const message=document.getElementById("message");

message.textContent=t("saving");

const {error}=await supabaseClient
.from("irrigation_records")
.insert([record]);

if(error){
message.textContent=t("error")+error.message;
return;
}

message.textContent=t("saved");

document.getElementById("irrigationForm").reset();

loadRecords();

});


// LOAD RECORDS

async function loadRecords(){

if(!currentUser)return;

const table=document.getElementById("recordsTable");

table.innerHTML=`<tr><td colspan="6">${t("loading")}</td></tr>`;

const {data,error}=await supabaseClient
.from("irrigation_records")
.select("*")
.eq("user_id",currentUser.id)
.order("irrigation_date",{ascending:false});

if(error){

table.innerHTML="";

const row=document.createElement("tr");
const cell=document.createElement("td");

cell.colSpan=6;
cell.textContent=t("error")+error.message;

row.appendChild(cell);
table.appendChild(row);

return;
}

if(!data||data.length===0){

table.innerHTML="";

const row=document.createElement("tr");
const cell=document.createElement("td");

cell.colSpan=6;
cell.textContent=t("noRecords");

row.appendChild(cell);
table.appendChild(row);

return;
}

table.innerHTML="";

data.forEach(record=>{

const row=document.createElement("tr");

const values=[
record.crop_name,
record.irrigation_date,
record.water_quantity+" L",
record.irrigation_method,
record.notes||t("notesEmpty")
];

values.forEach(value=>{

const cell=document.createElement("td");
cell.textContent=value;
row.appendChild(cell);

});

const actionCell=document.createElement("td");
const deleteButton=document.createElement("button");

deleteButton.textContent=t("delete");
deleteButton.className="delete-btn";

deleteButton.addEventListener("click",function(){
deleteRecord(record.id);
});

actionCell.appendChild(deleteButton);
row.appendChild(actionCell);
table.appendChild(row);

});

}


// DELETE RECORD

async function deleteRecord(id){

if(!confirm(t("confirmDelete")))return;

const {error}=await supabaseClient
.from("irrigation_records")
.delete()
.eq("id",id)
.eq("user_id",currentUser.id);

if(error){
alert(t("deleteError")+error.message);
return;
}

alert(t("deleted"));

loadRecords();

}


// START

applyLanguage();
checkUser();
