
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Recommendation</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #f1f8e9;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0002;
}

.language-box {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 15px;
}

.language-box select {
    width: auto;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

h1 {
    text-align: center;
    color: #2e7d32;
}

p {
    text-align: center;
    color: #555;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

select, input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 25px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1b5e20;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#result {
    margin-top: 25px;
    padding: 18px;
    background: #e8f5e9;
    border-radius: 8px;
    display: none;
}

.crop {
    background: white;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border-left: 4px solid #2e7d32;
}

.history-item {
    background: #f1f8e9;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
    border-left: 4px solid #2e7d32;
}

.status {
    text-align: center;
    margin-top: 12px;
    font-weight: bold;
}

@media(max-width:600px) {
    .container {
        padding: 18px;
    }
}
</style>
</head>

<div class="container">

    <div class="language-box">
        <select id="languageSelect">
            <option value="en">English</option>
            <option value="kn">ಕನ್ನಡ</option>
            <option value="hi">हिन्दी</option>
            <option value="te">తెలుగు</option>
            <option value="ta">தமிழ்</option>
        </select>
    </div>

    <h1 id="pageTitle">🌱 Crop Recommendation</h1>

    <p id="subtitle">
        Find suitable crops based on your farm conditions.
    </p>

    <label id="soilLabel">Soil Type</label>

    <select id="soil">
        <option value="" id="soilDefault">Select Soil Type</option>
        <option value="black" id="blackOption">Black Soil</option>
        <option value="red" id="redOption">Red Soil</option>
        <option value="loamy" id="loamyOption">Loamy Soil</option>
        <option value="sandy" id="sandyOption">Sandy Soil</option>
        <option value="alluvial" id="alluvialOption">Alluvial Soil</option>
    </select>

    <label id="areaLabel">Land Area (in acres)</label>

    <input type="number" id="area"
           placeholder="Enter land area"
           min="0.1" step="0.1">

    <label id="seasonLabel">Season</label>

    <select id="season">
        <option value="" id="seasonDefault">Select Season</option>
        <option value="kharif" id="kharifOption">Kharif (Monsoon)</option>
        <option value="rabi" id="rabiOption">Rabi (Winter)</option>
        <option value="summer" id="summerOption">Summer</option>
    </select>

    <label id="waterLabel">Water Availability</label>

    <select id="water">
        <option value="" id="waterDefault">Select Water Availability</option>
        <option value="high" id="highOption">High</option>
        <option value="medium" id="mediumOption">Medium</option>
        <option value="low" id="lowOption">Low</option>
    </select>

    <button id="recommendBtn" onclick="recommendCrops()">
        Get Crop Recommendation
    </button>

    <p id="status" class="status"></p>

    <div id="result"></div>

    <hr style="margin-top:30px;">

    <h2 id="historyTitle" style="color:#2e7d32;">
        📋 Recommendation History
    </h2>

    <div id="history">Loading history...</div>

</div>

// LANGUAGE CHANGE

function changeLanguage(lang) {

    currentLanguage = lang;

    localStorage.setItem("agritec_dashboard_language", lang);

    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("pageTitle").textContent = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;

    document.getElementById("soilLabel").textContent = t.soil;
    document.getElementById("soilDefault").textContent = t.soilDefault;
    document.getElementById("blackOption").textContent = t.black;
    document.getElementById("redOption").textContent = t.red;
    document.getElementById("loamyOption").textContent = t.loamy;
    document.getElementById("sandyOption").textContent = t.sandy;
    document.getElementById("alluvialOption").textContent = t.alluvial;

    document.getElementById("areaLabel").textContent = t.area;
    document.getElementById("area").placeholder = t.areaPlaceholder;

    document.getElementById("seasonLabel").textContent = t.season;
    document.getElementById("seasonDefault").textContent = t.seasonDefault;
    document.getElementById("kharifOption").textContent = t.kharif;
    document.getElementById("rabiOption").textContent = t.rabi;
    document.getElementById("summerOption").textContent = t.summer;

    document.getElementById("waterLabel").textContent = t.water;
    document.getElementById("waterDefault").textContent = t.waterDefault;
    document.getElementById("highOption").textContent = t.high;
    document.getElementById("mediumOption").textContent = t.medium;
    document.getElementById("lowOption").textContent = t.low;

    recommendBtn.textContent = t.button;
    document.getElementById("historyTitle").textContent = t.historyTitle;

    languageSelect.value = lang;

    if (lastRecommendation) {
        renderRecommendation(lastRecommendation);
    }

    loadHistory();
}

languageSelect.addEventListener("change", function() {
    changeLanguage(this.value);
});


// LOGIN CHECK

async function checkLogin() {

    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
        alert(translations[currentLanguage].login);
        window.location.href = "login.html";
        return null;
    }

    return data.user;
}


// CROP RECOMMENDATION LOGIC

function getRecommendedCrops(soil, season, water) {

    let crops = [];

    if (soil === "black") {
        crops = ["Cotton", "Sorghum (Jowar)", "Pigeon Pea (Tur)"];
    } else if (soil === "red") {
        crops = ["Groundnut", "Ragi", "Pigeon Pea (Tur)"];
    } else if (soil === "loamy") {
        crops = ["Maize", "Wheat", "Vegetables"];
    } else if (soil === "sandy") {
        crops = ["Groundnut", "Millets", "Watermelon"];
    } else if (soil === "alluvial") {
        crops = ["Rice", "Wheat", "Sugarcane"];
    }

    if (season === "kharif") {
        crops = crops.filter(crop =>
            ["Cotton", "Sorghum (Jowar)", "Pigeon Pea (Tur)",
             "Groundnut", "Ragi", "Maize", "Rice", "Millets"].includes(crop)
        );
    } else if (season === "rabi") {
        crops = crops.filter(crop =>
            ["Wheat", "Sorghum (Jowar)", "Pigeon Pea (Tur)",
             "Vegetables", "Ragi"].includes(crop)
        );
    } else {
        crops = crops.filter(crop =>
            ["Groundnut", "Maize", "Vegetables", "Watermelon"].includes(crop)
        );
    }

    if (water === "low") {
        crops = crops.filter(crop =>
            ["Ragi", "Millets", "Sorghum (Jowar)",
             "Pigeon Pea (Tur)"].includes(crop)
        );
    }

    if (water === "medium") {
        crops = crops.filter(crop =>
            crop !== "Sugarcane" && crop !== "Rice"
        );
    }

    return crops;
}


// DISPLAY TRANSLATED CROP NAME

function translateCrop(crop) {
    return translations[currentLanguage].cropNames[crop] || crop;
}


// DISPLAY RECOMMENDATION

function renderRecommendation(record) {

    const t = translations[currentLanguage];

    result.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = t.recommended;
    result.appendChild(heading);

    const areaText = document.createElement("p");
    areaText.textContent =
        t.landArea + ": " + record.area + " " + t.acres;
    result.appendChild(areaText);

    const seasonText = document.createElement("p");
    seasonText.textContent =
        t.selectedSeason + ": " +
        getSeasonName(record.season);
    result.appendChild(seasonText);

    record.crops.forEach(crop => {

        const item = document.createElement("div");
        item.className = "crop";
        item.textContent = "🌾 " + translateCrop(crop);
        result.appendChild(item);

    });

    const note = document.createElement("p");
    note.textContent = t.note;
    result.appendChild(note);

    result.style.display = "block";
}


// SEASON TRANSLATION

function getSeasonName(season) {

    const t = translations[currentLanguage];

    if (season === "kharif") return t.kharif;
    if (season === "rabi") return t.rabi;
    if (season === "summer") return t.summer;

    return season;
}


// SOIL TRANSLATION

function getSoilName(soil) {

    const t = translations[currentLanguage];

    const names = {
        black: t.black,
        red: t.red,
        loamy: t.loamy,
        sandy: t.sandy,
        alluvial: t.alluvial
    };

    return names[soil] || soil;
}


// WATER TRANSLATION

function getWaterName(water) {

    const t = translations[currentLanguage];

    const names = {
        high: t.high,
        medium: t.medium,
        low: t.low
    };

    return names[water] || water;
}


// GENERATE RECOMMENDATION

async function recommendCrops() {

    const t = translations[currentLanguage];

    statusBox.textContent = "";
    result.style.display = "none";

    const soil = document.getElementById("soil").value;
    const area = Number(document.getElementById("area").value);
    const season = document.getElementById("season").value;
    const water = document.getElementById("water").value;

    if (!soil || !area || area <= 0 || !season || !water) {
        alert(t.fill);
        return;
    }

    const user = await checkLogin();

    if (!user) return;

    recommendBtn.disabled = true;
    statusBox.textContent = t.saving;
    statusBox.style.color = "#555";

    const crops = getRecommendedCrops(soil, season, water);

    const finalCrops = crops.length > 0
        ? crops
        : ["NO_MATCH"];

    lastRecommendation = {
        area: area,
        season: season,
        crops: finalCrops
    };

    renderRecommendation(lastRecommendation);

    try {

        const { error } = await supabaseClient
            .from("crop_recommendations")
            .insert([{
                user_id: user.id,
                soil_type: soil,
                land_area: area,
                season: season,
                water_availability: water,
                recommended_crops: finalCrops
            }]);

        if (error) throw error;

        statusBox.textContent = t.saved;
        statusBox.style.color = "green";

        await loadHistory();

    } catch (error) {

        statusBox.textContent = t.saveError + error.message;
        statusBox.style.color = "red";

        console.error(error);

    } finally {

        recommendBtn.disabled = false;

    }
}


// LOAD RECOMMENDATION HISTORY

async function loadHistory() {

    const t = translations[currentLanguage];

    const user = await checkLogin();

    if (!user) return;

    historyBox.textContent = t.loadingHistory;

    const { data, error } = await supabaseClient
        .from("crop_recommendations")
        .select("*")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

    if (error) {

        historyBox.textContent = t.historyError + error.message;
        return;
    }

    if (!data || data.length === 0) {

        historyBox.textContent = t.noHistory;
        return;
    }

    historyBox.replaceChildren();

    data.forEach(record => {

        const card = document.createElement("div");
        card.className = "history-item";

        const title = document.createElement("h3");

        title.textContent =
            "🌱 " + getSoilName(record.soil_type);

        const details = document.createElement("p");

        details.textContent =
            t.areaText + ": " + record.land_area + " " + t.acres +
            " | " + t.seasonText + ": " + getSeasonName(record.season) +
            " | " + t.waterText + ": " +
            getWaterName(record.water_availability);

        const crops = document.createElement("p");

        let cropList = Array.isArray(record.recommended_crops)
            ? record.recommended_crops
            : [];

        crops.textContent = t.cropsText + ": " +
            cropList.map(crop => {
                return crop === "NO_MATCH"
                    ? t.noMatch
                    : translateCrop(crop);
            }).join(", ");

        const date = document.createElement("small");

        let locale = "en-IN";

        if (currentLanguage === "kn") locale = "kn-IN";
        if (currentLanguage === "hi") locale = "hi-IN";
        if (currentLanguage === "te") locale = "te-IN";
        if (currentLanguage === "ta") locale = "ta-IN";

        date.textContent = t.date + ": " +
            new Date(record.created_at).toLocaleString(locale);

        card.append(title, details, crops, date);

        historyBox.appendChild(card);

    });
}


// INITIALIZE PAGE

changeLanguage(currentLanguage);

</script>
