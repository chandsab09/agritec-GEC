function getLanguage() {
    return localStorage.getItem("agritec_dashboard_language") || "en";
}

function t(key) {
    const lang = getLanguage();
    return translations[lang]?.[key] || translations.en[key] || key;
}

function applyLanguage() {

    document.getElementById("languageSelect").value = getLanguage();

    document.getElementById("pageHeading").textContent = t("heading");
    document.getElementById("pageSubtitle").textContent = t("subtitle");

    document.getElementById("addTitle").textContent = t("addTitle");

    document.getElementById("nameLabel").textContent = t("name");
    document.getElementById("animalName").placeholder = t("namePlaceholder");

    document.getElementById("typeLabel").textContent = t("type");
    document.getElementById("animalType").placeholder = t("typePlaceholder");

    document.getElementById("numberLabel").textContent = t("number");
    document.getElementById("number").placeholder = t("numberPlaceholder");

    document.getElementById("ageLabel").textContent = t("age");
    document.getElementById("age").placeholder = t("agePlaceholder");

    document.getElementById("breedLabel").textContent = t("breed");
    document.getElementById("breed").placeholder = t("breedPlaceholder");

    document.getElementById("addButton").textContent = t("add");
    document.getElementById("backButton").textContent = t("back");

    document.getElementById("viewTitle").textContent = t("view");

    document.getElementById("nameHeading").textContent = t("nameHeading");
    document.getElementById("typeHeading").textContent = t("typeHeading");
    document.getElementById("numberHeading").textContent = t("numberHeading");
    document.getElementById("ageHeading").textContent = t("ageHeading");
    document.getElementById("breedHeading").textContent = t("breedHeading");
    document.getElementById("actionHeading").textContent = t("action");

    loadLivestock();
}

document.getElementById("languageSelect").addEventListener("change", function() {

    localStorage.setItem("agritec_dashboard_language", this.value);

    applyLanguage();
});

async function addLivestock() {

    const name = document.getElementById("animalName").value.trim();
    const type = document.getElementById("animalType").value.trim();
    const number = Number(document.getElementById("number").value);
    const age = document.getElementById("age").value.trim();
    const breed = document.getElementById("breed").value.trim();

    if (!name || !type || !number || number < 1 || !age || !breed) {

        alert(t("fillDetails"));

        return;
    }

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {

        alert(t("login"));

        window.location.href = "login.html";

        return;
    }

    const { error } = await supabaseClient
        .from("livestock")
        .insert([{
            animal_name: name,
            animal_type: type,
            quantity: number,
            age: age,
            breed: breed,
            user_id: user.id
        }]);

    if (error) {

        alert(t("addError") + error.message);

        return;
    }

    alert(t("added"));

    document.getElementById("animalName").value = "";
    document.getElementById("animalType").value = "";
    document.getElementById("number").value = "";
    document.getElementById("age").value = "";
    document.getElementById("breed").value = "";

    loadLivestock();
}

async function loadLivestock() {

    const list = document.getElementById("livestockList");

    list.innerHTML = `
        <tr>
            <td colspan="6">${t("loading")}</td>
        </tr>
    `;

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {

        list.innerHTML = `
            <tr>
                <td colspan="6">${t("login")}</td>
            </tr>
        `;

        window.location.href = "login.html";

        return;
    }

    const { data, error } = await supabaseClient
        .from("livestock")
        .select("*")
        .eq("user_id", user.id)
        .order("id", { ascending: false });

    if (error) {

        list.innerHTML = `
            <tr>
                <td colspan="6">${t("loadError")}${escapeHTML(error.message)}</td>
            </tr>
        `;

        return;
    }

    list.innerHTML = "";

    if (!data || data.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="6">${t("noRecords")}</td>
            </tr>
        `;

        return;
    }

    data.forEach(animal => {

        const row = document.createElement("tr");

        const values = [
            animal.animal_name,
            animal.animal_type,
            animal.quantity,
            animal.age,
            animal.breed
        ];

        values.forEach(value => {

            const cell = document.createElement("td");

            cell.textContent = value ?? "";

            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");

        const deleteButton = document.createElement("button");

        deleteButton.textContent = t("delete");
        deleteButton.className = "delete-btn";

        deleteButton.onclick = () => deleteLivestock(animal.id);

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        list.appendChild(row);
    });
}

async function deleteLivestock(id) {

    if (!confirm(t("deleteConfirm"))) {
        return;
    }

    const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !user) {

        alert(t("login"));

        window.location.href = "login.html";

        return;
    }

    const { error } = await supabaseClient
        .from("livestock")
        .delete()
        .eq("id", id)
        .eq("user_id", user.id);

    if (error) {

        alert(t("deleteFailed") + error.message);

        return;
    }

    alert(t("deleted"));

    loadLivestock();
}

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[char]));
}

applyLanguage();

</script>
